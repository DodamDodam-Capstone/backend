openapi: 3.0.3
info:
  title: DodamDodam P0 통합 API
  version: 3.1.0
  description: '2026-10-03 KST v3.1 최종 설계 계약. 24 paths / 26 operations / 61 schemas. F01~F08 확정: KST08~24, 화면 이탈은
    ACTIVE 유지, 이야기 마치기는 수동 종료 후 홈으로 이동. ACTIVE→CLOSING→ENDED, 접수 발화 원래 기한까지 정리, 아이당 ACTIVE/CLOSING 합계 최대1개, 같은 날
    새 대화 허용. 종료 전 연결된 유효 세션만 endedAt+600초 확인정보 복구. 빈 대화는 EMPTY, FE 고정 첫 인사는 AI/TTS/발화에서 제외. 이름과 nickname 별도 저장.
    동의·추가 보호자 정보 P0 제외, 기존 P0 범위 유지. D13/D14 AI 실제 wire·허용·수치와 D17 운영은 대기. 실제 구현·통합시험 완료를 뜻하지 않는다. Decision_Record.md
    및 통합 API/ERD/전달서와 함께 적용.'
tags:
- name: A-01
  description: 이메일 인증 및 가입
- name: A-02
  description: 로그인, 세션, Google, CSRF
- name: A-03
  description: 비밀번호 재설정
- name: A-04
  description: 아이 등록 및 프로필
- name: A-05
  description: 보호자 PIN
- name: A-06
  description: 보호자 기록 및 검색
- name: Part2
  description: 아이 홈·일반 음성 대화, B-01~B-05
paths:
  /api/v1/auth/csrf:
    get:
      tags:
      - A-02
      operationId: getCsrf
      summary: CSRF 토큰 획득
      description: 기존 CsrfController 형식 유지. data wrapper 예외. 최초 진입/로그인/로그아웃 뒤 재획득. 인증 쿠키가 아니라 XSRF-TOKEN 쿠키를 갱신할
        수 있다.
      security: []
      responses:
        '200':
          description: '성공. '
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfTokenResponse'
              examples:
                normal:
                  value:
                    headerName: X-XSRF-TOKEN
                    parameterName: _csrf
                    token: opaque-csrf-token
        '429':
          $ref: '#/components/responses/Error429RateLimited'
      x-task-id: A-02
      x-transaction: 읽기 전용. 동일 요청 반복 가능.
      x-tables-read: []
      x-tables-write: []
      x-owner: Part 1
  /api/v1/auth/email-verifications:
    post:
      tags:
      - A-01
      operationId: issueEmailVerification
      summary: 목적별 인증번호 발급 및 재발급
      description: SIGNUP/RESET_PASSWORD는 email 필수. PIN_SETUP/PIN_RESET은 로그인 계정 이메일 사용. PIN_SETUP은 기존PIN이면409, PIN_RESET은
        PIN없으면409. PIN_RESET은 계정/현재securityContext/setup_generation/pin_version_snapshot에 결합하며 PIN unlock 오답 차단
        중에도 이메일 재인증 요청 자체는 별도 이메일·IP 제한을 적용해 허용한다. 공개 목적 계정 존재는 decoy+동일200로 숨긴다. 유효한 재발급은 동일범위 기존 미소비 번호/토큰 폐기.
        메일 발송 실패·timeout·불명확은 해당 challenge 폐기 후503. 인증번호HMAC키교체는 기존권한폐기. 번호6자리·번호/토큰 각600초·재발급60초 및 요청제한 수치는 D17
        운영보류인 기존기술기준을 재사용한다.
      security:
      - {}
      - sessionCookie: []
      responses:
        '200':
          description: '성공. '
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationIssueResponse'
              examples:
                normal:
                  value:
                    data:
                      challengeId: 88888888-8888-4888-8888-888888888888
                      expiresAt: '2026-09-30T10:10:00+09:00'
                  summary: B-02.3 공유안 예시 발급10시00분 KST 기준600초, 재발급은10시01분부터
        '400':
          $ref: '#/components/responses/Error400ValidationFailed'
        '403':
          description: CSRF_INVALID / PIN_SETUP_AUTHORIZATION_REQUIRED / PIN_RESET_AUTHORIZATION_REQUIRED
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiError'
                - properties:
                    error:
                      properties:
                        code:
                          type: string
                          enum:
                          - CSRF_INVALID
                          - PIN_SETUP_AUTHORIZATION_REQUIRED
                          - PIN_RESET_AUTHORIZATION_REQUIRED
              examples:
                csrf_invalid:
                  value:
                    error:
                      code: CSRF_INVALID
                      message: 요청을 처리할 수 없습니다.
                      requestId: 99999999-9999-4999-8999-999999999999
                      fields: []
                pin_setup_authorization_required:
                  value:
                    error:
                      code: PIN_SETUP_AUTHORIZATION_REQUIRED
                      message: 요청을 처리할 수 없습니다.
                      requestId: 99999999-9999-4999-8999-999999999999
                      fields: []
                pin_reset_authorization_required:
                  value:
                    error:
                      code: PIN_RESET_AUTHORIZATION_REQUIRED
                      message: 요청을 처리할 수 없습니다.
                      requestId: 99999999-9999-4999-8999-999999999999
                      fields: []
        '413':
          $ref: '#/components/responses/Error413RequestTooLarge'
        '415':
          $ref: '#/components/responses/Error415UnsupportedMediaType'
        '503':
          $ref: '#/components/responses/Error503AuthStateUnavailableEmailDeliveryUnavailable'
        '401':
          $ref: '#/components/responses/Error401AuthenticationRequired'
        '409':
          description: PIN_ALREADY_SET / PIN_NOT_SET
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiError'
                - properties:
                    error:
                      properties:
                        code:
                          type: string
                          enum:
                          - PIN_ALREADY_SET
                          - PIN_NOT_SET
              examples:
                pin_already_set:
                  value:
                    error:
                      code: PIN_ALREADY_SET
                      message: 요청을 처리할 수 없습니다.
                      requestId: 99999999-9999-4999-8999-999999999999
                      fields: []
                pin_not_set:
                  value:
                    error:
                      code: PIN_NOT_SET
                      message: 요청을 처리할 수 없습니다.
                      requestId: 99999999-9999-4999-8999-999999999999
                      fields: []
        '429':
          $ref: '#/components/responses/Error429RateLimited'
      x-task-id: A-01
      x-transaction: 계정(로그인 PIN 목적)→session_security→guardian_pins→challenge 순서. 최초 발급도 email+purpose 또는 account+context+purpose
        advisory lock으로 직렬화. IP/목적별 요청량 사전 예약 후 업무 lock, 커밋 뒤 SMTP 호출(업무 DB lock 없음). 목적별 최신권한·PIN상태·기한 재검사.
      x-tables-read:
      - accounts
      - guardian_pins
      - session_security
      x-tables-write:
      - email_verifications
      - auth_rate_limits
      parameters:
      - name: X-XSRF-TOKEN
        in: header
        required: true
        schema:
          type: string
          minLength: 1
        description: GET auth/csrf 응답 token. 누락/불일치는 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueEmailVerificationRequest'
            examples:
              signup:
                value:
                  purpose: SIGNUP
                  email: guardian@example.com
              reset:
                value:
                  purpose: RESET_PASSWORD
                  email: guardian@example.com
              pinSetup:
                value:
                  purpose: PIN_SETUP
              pinReset:
                value:
                  purpose: PIN_RESET
      x-conditional-security: PIN_SETUP/PIN_RESET 목적은 반드시 sessionCookie 필요. 공개 목적 SIGNUP/RESET_PASSWORD만 익명 허용.
      x-owner: Part 1
  /api/v1/auth/email-verifications/verify:
    post:
      tags:
      - A-01
      operationId: verifyEmailCode
      summary: 인증번호 검증 및 토큰 발급
      description: purpose는 challenge에서 결정한다. 두 PIN 목적은 현재로그인/계정/문맥/generation을 확인하고 PIN_RESET은 현재pin_version과 발급snapshot도
        일치해야 한다. PIN 목적의 실제 challenge 계정·문맥·폐기·generation/version 불일치는403이며 만료/소비보다 우선한다. 코드오답/형식상정상인잘못된토큰·만료/소비는400.
        실제오답은 상태를커밋하며 기존기술기준5번째429. 성공 시번호재사용금지+token발급, 응답유실은재발급부터복구. 번호만료와token만료는독립이다.
      security:
      - {}
      - sessionCookie: []
      responses:
        '200':
          description: '성공. '
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationGrantResponse'
              examples:
                normal:
                  value:
                    data:
                      verificationToken: 88888888-8888-4888-8888-888888888888.AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
                      tokenExpiresAt: '2026-09-30T10:15:00+09:00'
                  summary: B-02.3 공유안 예시 검증 성공10시05분 KST 기준600초, 번호 만료10시10분 이후에도 토큰은 별도 만료까지 유지
        '400':
          $ref: '#/components/responses/Error400ValidationFailedVerificationInvalid'
        '403':
          description: CSRF_INVALID / PIN_SETUP_AUTHORIZATION_REQUIRED / PIN_RESET_AUTHORIZATION_REQUIRED
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiError'
                - properties:
                    error:
                      properties:
                        code:
                          type: string
                          enum:
                          - CSRF_INVALID
                          - PIN_SETUP_AUTHORIZATION_REQUIRED
                          - PIN_RESET_AUTHORIZATION_REQUIRED
              examples:
                csrf_invalid:
                  value:
                    error:
                      code: CSRF_INVALID
                      message: 요청을 처리할 수 없습니다.
                      requestId: 99999999-9999-4999-8999-999999999999
                      fields: []
                pin_setup_authorization_required:
                  value:
                    error:
                      code: PIN_SETUP_AUTHORIZATION_REQUIRED
                      message: 요청을 처리할 수 없습니다.
                      requestId: 99999999-9999-4999-8999-999999999999
                      fields: []
                pin_reset_authorization_required:
                  value:
                    error:
                      code: PIN_RESET_AUTHORIZATION_REQUIRED
                      message: 요청을 처리할 수 없습니다.
                      requestId: 99999999-9999-4999-8999-999999999999
                      fields: []
        '413':
          $ref: '#/components/responses/Error413RequestTooLarge'
        '415':
          $ref: '#/components/responses/Error415UnsupportedMediaType'
        '503':
          $ref: '#/components/responses/Error503AuthStateUnavailable'
        '401':
          $ref: '#/components/responses/Error401AuthenticationRequired'
        '409':
          description: PIN_ALREADY_SET / PIN_NOT_SET
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiError'
                - properties:
                    error:
                      properties:
                        code:
                          type: string
                          enum:
                          - PIN_ALREADY_SET
                          - PIN_NOT_SET
              examples:
                pin_already_set:
                  value:
                    error:
                      code: PIN_ALREADY_SET
                      message: 요청을 처리할 수 없습니다.
                      requestId: 99999999-9999-4999-8999-999999999999
                      fields: []
                pin_not_set:
                  value:
                    error:
                      code: PIN_NOT_SET
                      message: 요청을 처리할 수 없습니다.
                      requestId: 99999999-9999-4999-8999-999999999999
                      fields: []
        '429':
          $ref: '#/components/responses/Error429RateLimited'
      x-task-id: A-01
      x-transaction: IP 예산은 challenge 조회 전 별도 예약. PIN 목적 accounts→session_security→guardian_pins→challenge 잠금 순서;
        상태 최종 재검사 후 token해시/기한 원자 기록. 실제 오답·폐기 상태는400/429응답 때문에 rollback하지 않음.
      x-tables-read:
      - accounts
      - session_security
      - guardian_pins
      x-tables-write:
      - email_verifications
      - auth_rate_limits
      parameters:
      - name: X-XSRF-TOKEN
        in: header
        required: true
        schema:
          type: string
          minLength: 1
        description: GET auth/csrf 응답 token. 누락/불일치는 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailCodeRequest'
            examples:
              normal:
                value:
                  challengeId: 88888888-8888-4888-8888-888888888888
                  code: '012345'
                summary: B-02.3 Part 1 공유안의6자리 문자열, 선행0 보존
      x-conditional-security: PIN_SETUP/PIN_RESET 목적은 반드시 sessionCookie 필요. 공개 목적 SIGNUP/RESET_PASSWORD만 익명 허용.
      x-owner: Part 1
  /api/v1/auth/signup:
    post:
      tags:
      - A-01
      operationId: signup
      summary: 이메일 회원가입
      description: SIGNUP 토큰에 결합된 이메일로만 계정을 생성한다. 요청은 verificationToken/password 두 필드이며 추가 동의·보호자 정보는 P0 제외(D15).
        유효권한 소비와 계정생성을 한 Tx로 처리한다. email중복409, 가입201 후 자동로그인 없이 명시적로그인. 응답유실시로그인으로확인.
      security: []
      responses:
        '201':
          description: '성공. '
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Location:
              schema:
                type: string
              description: 생성 리소스 식별 URI. 별도 GET 지원을 의미하지 않는다.
              example: /api/v1/accounts/11111111-1111-4111-8111-111111111111
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupResultResponse'
              examples:
                normal:
                  value:
                    data:
                      accountId: 11111111-1111-4111-8111-111111111111
        '400':
          $ref: '#/components/responses/Error400ValidationFailedVerificationInvalid'
        '403':
          $ref: '#/components/responses/Error403CsrfInvalid'
        '413':
          $ref: '#/components/responses/Error413RequestTooLarge'
        '415':
          $ref: '#/components/responses/Error415UnsupportedMediaType'
        '503':
          $ref: '#/components/responses/Error503AuthStateUnavailable'
        '409':
          $ref: '#/components/responses/Error409AccountAlreadyExists'
        '429':
          $ref: '#/components/responses/Error429RateLimited'
      x-task-id: A-01
      x-transaction: accounts 생성과 challenge 검증/소비 원자 커밋; 일반업무실패시소비도rollback.
      x-tables-read:
      - email_verifications
      x-tables-write:
      - accounts
      - email_verifications
      - auth_rate_limits
      parameters:
      - name: X-XSRF-TOKEN
        in: header
        required: true
        schema:
          type: string
          minLength: 1
        description: GET auth/csrf 응답 token. 누락/불일치는 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
            examples:
              normal:
                value:
                  verificationToken: 88888888-8888-4888-8888-888888888888.AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
                  password: Example-Password-Only!
      x-owner: Part 1
      x-decision-ids:
      - D-15
  /api/v1/auth/login:
    post:
      tags:
      - A-02
      operationId: login
      summary: 이메일 로그인
      description: 없는 email/틀린 password/소셜 전용은 동일 401 LOGIN_FAILED. session fixation 방어로 세션 교체, PIN 확인 복사 없음. reset과
        경쟁 시 account session_version 및 password hash 재검사. 새 CSRF 획득 필요. B-05.4 별도 rememberMe 필드/체크박스/자동 복원 미도입.
        비밀번호 로그인은 정규화 email10회/IP100회 각900초 고정창(B-02.7 공유안), 처리 예약된 성공/실패 포함·한도번째 처리/다음부터429. 기존 키·예약 단계 유지, Google
        OAuth는 별도 API_IP 정책. 비존재 계정에도 dummy password hash 비교를 수행하며 요청량에 포함한다.
      security: []
      responses:
        '200':
          description: '성공. '
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Set-Cookie:
              schema:
                type: string
              description: B-05.4 인증된 일반 로그인 JSESSIONID 지속 쿠키365일(Max-Age=31536000), 유효 사용 확인 후 응답 재발급/갱신. cookieMaxAge
                설정만으로 갱신되지 않음. HttpOnly; 운영 Secure; Path=/; SameSite는 배포 구성에 맞춤. 로그 금지.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountViewResponse'
              examples:
                normal:
                  value:
                    data:
                      accountId: 11111111-1111-4111-8111-111111111111
                      email: guardian@example.com
                      childId: null
                      hasPin: false
                      guardianUnlockedUntil: null
        '400':
          $ref: '#/components/responses/Error400ValidationFailed'
        '403':
          $ref: '#/components/responses/Error403CsrfInvalid'
        '413':
          $ref: '#/components/responses/Error413RequestTooLarge'
        '415':
          $ref: '#/components/responses/Error415UnsupportedMediaType'
        '503':
          $ref: '#/components/responses/Error503AuthStateUnavailable'
        '401':
          $ref: '#/components/responses/Error401LoginFailed'
        '429':
          $ref: '#/components/responses/Error429RateLimited'
      x-task-id: A-02
      x-transaction: 현재 자격 재검사+새 session_security 생성. B-05.1 Spring Session JDBC 저장은 기본 REQUIRES_NEW로 업무 트랜잭션과 자동
        원자적이지 않음. 세션 저장 실패503·성공 응답 금지 및 버전/폐기 판정 유지. 이전 session_security 폐기 후 새 문맥 등록. framework 세션 저장까지 성공한 뒤200;
        DB만 성공하고 저장 실패 시 새 보조 문맥 폐기 후503. 이전 권한 복구 금지.
      x-tables-read:
      - accounts
      - children
      - guardian_pins
      x-tables-write:
      - session_security
      - email_verifications
      - auth_rate_limits
