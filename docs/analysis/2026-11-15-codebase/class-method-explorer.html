<script>
(() => {
  const root = document.getElementById('dodam-code-explorer');
  const data = JSON.parse(document.getElementById('dd-code-data').textContent);
  const query = id => root.querySelector('#' + id);
  const classes = new Map(data.classes.map(c => [c.id,c]));
  const methods = new Map(data.methods.map(m => [m.id,m]));
  const search = query('dd-search'), classSelect = query('dd-class'), methodSelect = query('dd-method');
  const incoming = query('dd-incoming'), outgoing = query('dd-outgoing');
  const label = m => (m.owner.replace('com.dodamdodam.backend.','')) + '.' + (m.name === '<init>' ? '생성자' : m.name);
  const simple = s => s.replaceAll('com.dodamdodam.backend.','').replaceAll('java.lang.','').replaceAll('java.util.','').replaceAll('java.time.','');
  const element = (tag, text, className) => {const e=document.createElement(tag);e.textContent=text;if(className)e.className=className;return e;};
  const defaultMethod = data.methods.find(m => m.owner.endsWith('.ChildService') && m.name==='create');
  let selectedId = defaultMethod.id;
  let matches = data.methods;
  function restore(value) {
    const id=value?.privateContent?.selectedId;
    if(methods.has(id)){selectedId=id;search.value='';matches=data.methods;populateClasses();}
  }
  function save() {
    const m=methods.get(selectedId);
    if(window.openai?.setWidgetState) window.openai.setWidgetState({modelContent:{method:label(m),source:classes.get(m.owner).file,line:m.line},privateContent:{selectedId}}).catch(()=>{});
  }
  function populateClasses() {
    classSelect.replaceChildren();
    const ids=new Set(matches.map(m=>m.owner));
    for(const c of data.classes.filter(c=>ids.has(c.id))) {
      const opt=element('option',c.id.replace('com.dodamdodam.backend.',''));
      opt.value=c.id;classSelect.append(opt);
    }
    const selected=methods.get(selectedId);
    if(selected && ids.has(selected.owner)) classSelect.value=selected.owner;
    populateMethods();
  }
  function populateMethods() {
    methodSelect.replaceChildren();
    const available=matches.filter(m=>m.owner===classSelect.value);
    for(const m of available) {
      const opt=element('option',(m.generated?'자동 · ':'')+simple(m.signature));
      opt.value=m.id;methodSelect.append(opt);
    }
    if(available.some(m=>m.id===selectedId)) methodSelect.value=selectedId;
    selectedId=methodSelect.value;
    render();
  }
  function navigate(id) {
    if(!methods.has(id))return;
    selectedId=id;search.value='';matches=data.methods;populateClasses();save();
  }
  function node(id, detail) {
    const m=methods.get(id);
    if(!m)return element('div',id.replace('com.dodamdodam.backend.',''),'text-small');
    const group=element('div','','dd-node');
    group.append(element('span',m.owner.replace('com.dodamdodam.backend.',''),'text-small dd-node-label'));
    const b=element('button',m.name==='<init>'?'생성자':m.name,'btn btn-ghost');b.type='button';
    group.append(b);
    group.append(element('span',detail+(m.generated?' · 자동':''),'text-small text-muted dd-node-label'));
    b.setAttribute('aria-label',label(m)+'로 이동');b.addEventListener('click',()=>navigate(id));return group;
  }
  function render() {
    const m=methods.get(selectedId);
    query('dd-definition').replaceChildren();incoming.replaceChildren();outgoing.replaceChildren();query('dd-selected').replaceChildren();query('dd-external').replaceChildren();
    if(!m){query('dd-definition').append(element('p','검색 결과 없음'));return;}
    const c=classes.get(m.owner);
    classSelect.setAttribute('data-tooltip',c.id);
    methodSelect.setAttribute('data-tooltip',m.signature);
    query('dd-definition').append(element('h3',label(m)));
    query('dd-definition').append(element('div',c.file+(m.generated?' · 컴파일러 생성':':'+m.line),'text-small'));
    if(m.doc)query('dd-definition').append(element('div',m.doc.trim()));
    query('dd-selected').append(element('pre',simple(m.signature)));
    if(m.annotations.length)query('dd-selected').append(element('div',simple(m.annotations.join(' · ')),'text-small'));
    if(c.annotations.length)query('dd-selected').append(element('div',simple(c.annotations.join(' · ')),'text-small text-muted'));
    const ins=data.edges.filter(e=>e.to===selectedId), outs=data.edges.filter(e=>e.from===selectedId);
    for(const e of ins)incoming.append(node(e.from,(e.kind==='reference'?'참조':'호출')+' · L'+e.lines.join(', ')));
    for(const f of data.framework.filter(f=>f.to===selectedId)) incoming.append(element('div','프레임워크 · '+f.label,'text-small'));
    if(!incoming.childNodes.length)incoming.append(element('div',m.generated?'명시적 호출 없음':'정적 호출자 없음 · 프레임워크 연결 여부는 소스 확인','text-small text-muted'));
    for(const e of outs)outgoing.append(node(e.to,(e.kind==='reference'?'참조':e.kind==='new'?'생성':'호출')+' · L'+e.lines.join(', ')));
    if(!outs.length)outgoing.append(element('div','프로젝트 내부 호출 없음','text-small text-muted'));
    for(const s of data.external[selectedId]||[])query('dd-external').append(element('code',simple(s)));
    if(!query('dd-external').childNodes.length)query('dd-external').append(element('span','없음'));
  }
  search.addEventListener('input',()=>{
    const q=search.value.trim().toLowerCase();
    matches=data.methods.filter(m=>(m.owner+' '+m.name).toLowerCase().includes(q));populateClasses();
  });
  classSelect.addEventListener('change',()=>{populateMethods();save();});
  methodSelect.addEventListener('change',()=>{selectedId=methodSelect.value;render();save();});
  populateClasses();
  restore(window.openai?.widgetState);
  window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState)restore(e.detail.globals.widgetState);});
})();
</script>
