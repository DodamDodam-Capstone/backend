name: Review State Changed

on:
  pull_request_review:
    types: [submitted, dismissed]
  pull_request:
    types: [opened, reopened, edited]

permissions: {}

jobs:
  signal:
    if: >-
      vars.DEVELOPMENT_MANUAL_REVIEW == 'true' &&
      (github.event.pull_request.base.ref == 'development' || github.event.changes.base.ref.from == 'development')
    runs-on: ubuntu-latest
    steps:
      # PR의 코드를 실행하지 않고 기본 브랜치 발행기에 이벤트만 알린다.
      - run: echo '리뷰 상태 재확인'
