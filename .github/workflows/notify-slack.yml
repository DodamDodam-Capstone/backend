name: Slack Notification

on:
  issue_comment:
    types: [created, edited]
  workflow_run:
    workflows:
      - Backend CI
      - PR Title
      - Jira Key
      - Component Sync
      - Close Linked Issues
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: slack-notification-${{ github.event.workflow_run.id || github.run_id }}-${{ github.event.workflow_run.run_attempt || github.run_attempt }}
  cancel-in-progress: false

jobs:
  notify:
    name: slack-notification
    if: github.event_name == 'workflow_run' || (github.event.issue.pull_request && github.event.sender.id == 199175422 && github.event.comment.user.id == 199175422 && startsWith(github.event.comment.body, '<!-- codex-pull-request-review-summary -->'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 신뢰된 backend 알림 코드 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: 검증된 Slack helper 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DodamDodam-Capstone/integration
          ref: 37f994f5fbdf18ea1b68ba058d7ab97f5a1c806d
          path: .automation
          persist-credentials: false

      - name: Backend Slack 채널에 결과 전송
        run: python3 .github/scripts/notify_pr_review.py
        env:
          PYTHONPATH: .automation/.github/scripts
          REVIEW_RISK_APP_ID: ${{ vars.REVIEW_RISK_APP_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_API_TOKEN: ${{ github.token }}
