name: Component Sync

on:
  # 품질 검사와 Release 생성이 성공한 CI에서만 호출한다.
  workflow_call:
    secrets:
      INTEGRATION_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  dispatch:
    if: github.ref == 'refs/heads/main'
    name: notify-integration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create Integration Bot token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: Iv23liyibAu0H0gOIi2f
          private-key: ${{ secrets.INTEGRATION_APP_PRIVATE_KEY }}
          owner: DodamDodam-Capstone
          repositories: integration
          permission-contents: write

      - name: Notify integration repository
        if: steps.app-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          COMPONENT: backend
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          SOURCE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY' | gh api --method POST repos/DodamDodam-Capstone/integration/dispatches --input -
          import json
          import os
          import re

          match = re.search(r"\bSCRUM-\d+\b", os.environ.get("SOURCE_COMMIT_MESSAGE", ""))

          print(json.dumps({
              "event_type": "component-main-updated",
              "client_payload": {
                  "component": os.environ["COMPONENT"],
                  "repository": os.environ["SOURCE_REPOSITORY"],
                  "sha": os.environ["SOURCE_SHA"],
                  "jira_key": match.group(0) if match else "",
                  "run_url": os.environ["SOURCE_RUN_URL"],
              },
          }))
          PY
