name: Backend CI
on:
  workflow_dispatch:
  pull_request:
    branches: [main, development]
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: backend-quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Agent policy regression checks
        run: python3 .github/scripts/test_agent_policy.py
      - name: Agent document and attribution checks
        run: python3 .github/scripts/check_agent_policy.py
      - name: Detect build system
        id: build
        shell: bash
        run: |
          if [[ -x ./gradlew && ( -f build.gradle || -f build.gradle.kts ) ]]; then
            echo "system=gradle" >> "$GITHUB_OUTPUT"
          elif [[ -x ./mvnw && -f pom.xml ]]; then
            echo "system=maven" >> "$GITHUB_OUTPUT"
          elif [[ -f build.gradle || -f build.gradle.kts || -f pom.xml ]]; then
            echo "A build file exists but its wrapper is missing or not executable." >&2
            exit 1
          else
            echo "system=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! -f .java-version ]]; then
            echo "A build is configured but .java-version is missing." >&2
            exit 1
          fi
          echo "java-version=$(tr -d '[:space:]' < .java-version)" >> "$GITHUB_OUTPUT"
      - name: Repository readiness
        if: steps.build.outputs.system == 'none'
        run: echo "Backend source is not initialized yet; CI configuration is ready."
      - name: Set up Java
        if: steps.build.outputs.system != 'none'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          verify-signature: true
          java-version: ${{ steps.build.outputs.java-version }}
          cache: ${{ steps.build.outputs.system }}
      - name: Gradle checks
        if: steps.build.outputs.system == 'gradle'
        run: ./gradlew clean check --no-daemon
      - name: Maven checks
        if: steps.build.outputs.system == 'maven'
        run: ./mvnw -B verify
