name: Backend CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main, development]
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  # PR의 오래된 검사는 취소하되 서로 다른 main 커밋의 릴리스는 취소하지 않는다.
  group: backend-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  quality:
    name: backend-quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Agent policy regression checks
        run: python3 .github/scripts/test_agent_policy.py
      - name: Agent document and attribution checks
        run: python3 .github/scripts/check_agent_policy.py
      - name: SCRUM review routing policy regression checks
        run: |
          python3 .github/scripts/test_review_routing.py
          python3 .github/scripts/test_notify_pr_review.py
          python3 .github/scripts/test_deep_review.py
          python3 .github/scripts/test_sol_max_comments.py
      - name: CI contract regression checks
        run: python3 .github/scripts/test_ci_contract.py
      - name: Release and PR contract regression checks
        run: python3 .github/scripts/test_release.py
      - name: Compose configuration and cookie checks
        run: python3 .github/scripts/check_compose.py
      - name: Detect build system
        id: build
        shell: bash
        run: |
          if [[ -x ./gradlew && ( -f build.gradle || -f build.gradle.kts ) ]]; then
            echo "system=gradle" >> "$GITHUB_OUTPUT"
          elif [[ -x ./mvnw && -f pom.xml ]]; then
            echo "system=maven" >> "$GITHUB_OUTPUT"
          elif [[ -f build.gradle || -f build.gradle.kts || -f pom.xml ]]; then
            echo "A build file exists but its wrapper is missing or not executable." >&2
            exit 1
          else
            echo "No supported build configuration exists; backend-quality requires a build." >&2
            exit 1
          fi
          if [[ ! -f .java-version ]]; then
            echo "A build is configured but .java-version is missing." >&2
            exit 1
          fi
          echo "java-version=$(tr -d '[:space:]' < .java-version)" >> "$GITHUB_OUTPUT"
      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          verify-signature: true
          java-version: ${{ steps.build.outputs.java-version }}
          cache: ${{ steps.build.outputs.system }}
      - name: Gradle checks
        if: steps.build.outputs.system == 'gradle'
        run: ./gradlew clean check --no-daemon
      - name: Maven checks
        if: steps.build.outputs.system == 'maven'
        run: ./mvnw -B verify

  release:
    name: backend-release
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout the verified main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Create the version snapshot and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release.py

  notify-integration:
    needs: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: ./.github/workflows/notify-integration.yml
    secrets: inherit
