name: Development Manual Review

on:
  workflow_run:
    workflows: [Slack Notification, Review State Changed]
    types: [completed]
  issue_comment:
    types: [created, edited]
  schedule:
    # 승인·대화 해결 뒤의 재평가와 GitHub 이벤트 누락을 보완한다.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  candidates:
    if: >-
      github.repository == 'DodamDodam-Capstone/backend' && github.ref == 'refs/heads/main' &&
      vars.DEVELOPMENT_MANUAL_REVIEW == 'true' &&
      (github.event_name != 'issue_comment' || (github.event.issue.pull_request &&
        ((github.event.comment.user.id == 199175422 && startsWith(github.event.comment.body, '<!-- codex-pull-request-review-summary -->')) ||
        (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        startsWith(github.event.comment.body, '@codex review')))))
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      numbers: ${{ steps.list.outputs.numbers }}
    steps:
      - id: list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 대기 실행이 새 요청으로 합쳐져도 모든 열린 PR을 다시 확인한다.
          numbers=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls?state=open&base=development&per_page=100" --jq '[.[][] | .number]')
          echo "numbers=$numbers" >> "$GITHUB_OUTPUT"

  review:
    needs: candidates
    if: needs.candidates.outputs.numbers != '[]'
    # 후보를 확인한 작업만 직렬화하고 이미 대기하는 다른 PR 작업을 보존한다.
    concurrency:
      group: backend-manual-review-publisher
      queue: max
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        number: ${{ fromJSON(needs.candidates.outputs.numbers) }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: development-review-merge
      deployment: false
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read
      issues: read
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.LOW_RISK_APP_CLIENT_ID }}
          private-key: ${{ secrets.LOW_RISK_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: backend
          permission-pull-requests: write
          permission-checks: write
          permission-members: read
      - name: 최신 리뷰와 CI를 재확인해 수동 병합 검사 발행
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_APP_TOKEN: ${{ steps.app.outputs.token }}
          PR_NUMBER: ${{ matrix.number }}
        run: python3 .github/scripts/manual_review.py "$PR_NUMBER" --publish
