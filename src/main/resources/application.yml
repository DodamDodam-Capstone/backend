spring:
  application:
    name: dodamdodam-backend
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:dodamdodam}}
    username: ${DB_USERNAME:${POSTGRES_USER:dodamdodam}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:dodamdodam_local}}
  docker:
    compose:
      enabled: ${SPRING_DOCKER_COMPOSE_ENABLED:true}
      lifecycle-management: start-only
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  oauth2:
    google:
      client-id: ${GOOGLE_CLIENT_ID:local-google-client-id}
      client-secret: ${GOOGLE_CLIENT_SECRET:local-google-client-secret}
    kakao:
      client-id: ${KAKAO_CLIENT_ID:local-kakao-client-id}
      client-secret: ${KAKAO_CLIENT_SECRET:local-kakao-client-secret}
  security:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
    login-success-url: ${APP_LOGIN_SUCCESS_URL:http://localhost:5173/oauth/callback}
    logout-success-url: ${APP_LOGOUT_SUCCESS_URL:http://localhost:5173}
